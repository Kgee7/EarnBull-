# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
run:
  command: "npm run start"
build:
  command: "npm run build"
requires:
  server: true
runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  availability: "private"
  env:
    - variable: "MOMO_TARGET_ENVIRONMENT"
      value: "sandbox"
    - variable: "MOMO_BASE_URL"
      value: "https://sandbox.momodeveloper.mtn.com"
    - variable: "GEMINI_API_KEY"
      secret: "GEMINI_API_KEY"
    - variable: "MOMO_API_USER"
      secret: "MOMO_API_USER"
    - variable: "MOMO_API_KEY"
      secret: "MOMO_API_KEY"
    - variable: "MOMO_SUBSCRIPTION_KEY"
      secret: "MOMO_SUBSCRIPTION_KEY"